<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Monetag SDK -->
<script
  src="https://libtl.com/sdk.js"
  data-zone="11565402"
  data-sdk="show_11565402">
</script>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Daily Reward</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
      min-height: 100vh;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      padding: 28px 20px 90px;
    }

    .header {
      text-align: center;
      margin-top: 20px;
    }

    .header h1 {
      font-size: 21px;
      font-weight: 600;
    }

    .welcome {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #777;
    }

    .balance {
      text-align: center;
      margin-top: 55px;
    }

    .points {
      font-size: 54px;
      font-weight: 700;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    .claim {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 45px;
      cursor: pointer;
    }

    .claim:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .ad {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 17px;
      border-radius: 12px;
      margin-top: 14px;
      cursor: pointer;
    }

    .ad-title {
      font-size: 15px;
      font-weight: 500;
    }

    .ad-reward {
      font-size: 14px;
      color: #777;
    }

    .status {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: #777;
      min-height: 18px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: auto;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      padding: 15px 0;
    }

    .nav-item {
      font-size: 13px;
      color: #777;
    }

    .nav-item.active {
      color: #111;
      font-weight: 600;
    }

  </style>

</head>


<body>

  <div class="app">

    <div class="header">
      <h1>Daily Reward</h1>
    </div>


    <div
      class="welcome"
      id="welcome">

      Connecting...

    </div>


    <div class="balance">

      <div
        class="points"
        id="points">

        ...

      </div>

      <div class="label">
        POINTS
      </div>

    </div>


    <button
      class="claim"
      id="claimButton"
      disabled>

      Daily Reward

    </button>


    <div
      class="ad"
      id="watchAd">

      <div class="ad-title">
        Watch Ad
      </div>

      <div class="ad-reward">
        +10 Points
      </div>

    </div>


    <div
      class="status"
      id="status">

      Connecting to account...

    </div>

  </div>


  <div class="bottom-nav">

    <div class="nav-item active">
      Home
    </div>

    <div class="nav-item">
      Tasks
    </div>

    <div class="nav-item">
      Profile
    </div>

  </div>



  <!-- ======================================
       MAIN JAVASCRIPT
       ====================================== -->

  <script>


    /* ======================================
       Telegram WebApp
       ====================================== */

    const tg = window.Telegram?.WebApp;
setTimeout(() => {
    console.log(
        "MONETAG SDK TEST:",
        typeof window.show_11565402
    );
}, 3000);

    /* ======================================
       Supabase Functions
       ====================================== */

    const AUTH_URL =
      "https://pjypwghzuyjoabcpmbok.supabase.co/functions/v1/telegram-auth";


    const REWARD_URL =
      "https://pjypwghzuyjoabcpmbok.supabase.co/functions/v1/Claim-Reward";


    let currentUser = null;



    /* ======================================
       Telegram Login
       ====================================== */

    async function loginUser() {

      const status =
        document.getElementById("status");


      try {

        console.log("SCRIPT LOADED");

        status.innerText =
          "1. Login started...";


        /* Check Telegram */

        if (!tg) {

          throw new Error(
            "Telegram WebApp is not available"
          );

        }


        /* Initialize Telegram */

        tg.ready();

        tg.expand();


        console.log(
          "Telegram WebApp initialized"
        );


        /* Get initData */

        const initData =
          tg.initData;


        console.log(
          "initData available:",
          !!initData
        );


        if (!initData) {

          throw new Error(
            "initData is empty. Please open this app inside Telegram."
          );

        }


        status.innerText =
          "2. initData found...";


        /* Send authentication request */

        const response =
          await fetch(
            AUTH_URL,
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                initData: initData
              })

            }
          );


        status.innerText =
          "3. Server responded...";


        const result =
          await response.json();


        console.log(
          "AUTH RESULT:",
          result
        );


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.error ||
            "Authentication failed"
          );

        }


        /* Save current user */

        currentUser =
          result.user;


        console.log(
          "CURRENT USER:",
          currentUser
        );


        /* Update points */

        document
          .getElementById("points")
          .innerText =
          currentUser.points ?? 0;


        /* User name */

        const name =
          currentUser.first_name ||
          currentUser.username ||
          "User";


        document
          .getElementById("welcome")
          .innerText =
          "Welcome, " + name;


        /* Login successful */

        status.innerText =
          "Account connected successfully.";


        /* Enable daily reward button */

        document
          .getElementById("claimButton")
          .disabled = false;


      }

      catch (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );


        status.innerText =
          "ERROR: " +
          (
            error?.message ||
            "Unknown error"
          );

      }

    }



    /* ======================================
       Claim Reward
       ====================================== */

    async function claimReward() {

      const button =
        document.getElementById(
          "claimButton"
        );


      const status =
        document.getElementById(
          "status"
        );


      try {

        if (!currentUser) {

          throw new Error(
            "Account is not connected yet."
          );

        }


        button.disabled = true;

        button.innerText =
          "Claiming...";


        status.innerText =
          "Processing reward...";


        /* Get Telegram initData */

        if (!tg) {

          throw new Error(
            "Telegram WebApp is not available."
          );

        }


        const initData =
          tg.initData;


        if (!initData) {

          throw new Error(
            "Telegram session data is missing."
          );

        }


        /* Send reward request */

        const response =
          await fetch(
            REWARD_URL,
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                initData: initData
              })

            }
          );


        const result =
          await response.json();


        console.log(
          "REWARD RESULT:",
          result
        );


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.error ||
            "Reward could not be claimed."
          );

        }


        /* Update points */

        document
          .getElementById("points")
          .innerText =
          result.points;


        status.innerText =
          "+10 Points added successfully";


        button.innerText =
          "Reward Claimed";


        /* Haptic feedback */

        if (
          tg.HapticFeedback &&
          tg.HapticFeedback.notificationOccurred
        ) {

          tg.HapticFeedback.notificationOccurred(
            "success"
          );

        }


      }

      catch (error) {

        console.error(
          "REWARD ERROR:",
          error
        );


        status.innerText =
          error?.message ||
          "Something went wrong";


        button.innerText =
          "Daily Reward";


        button.disabled =
          false;

      }

    }



    /* ======================================
       Daily Reward Button
       ====================================== */

    document
      .getElementById(
        "claimButton"
      )
      .addEventListener(
        "click",
        claimReward
      );



    /* ======================================
   Monetag Watch Ad
   ====================================== */

document
  .getElementById("watchAd")
  .addEventListener("click", async function () {

    const status =
      document.getElementById("status");

    console.log("WATCH AD CLICKED");

    try {

      if (!currentUser) {
        throw new Error(
          "Please wait until your account is connected."
        );
      }

      status.innerText = "Checking ad...";

      console.log(
        "MONETAG SDK:",
        typeof window.show_11565402
      );

      if (
        typeof window.show_11565402 !== "function"
      ) {
        throw new Error(
          "Monetag SDK is not loaded."
        );
      }

      status.innerText = "Loading ad...";

      const ymid =
        String(currentUser.id) +
        "_" +
        Date.now();

      console.log(
        "Starting Monetag ad:",
        ymid
      );

      const adResult =
        await window.show_11565402({
          ymid: ymid,
          requestVar: "daily_reward"
        });

      console.log(
        "MONETAG AD RESULT:",
        adResult
      );

      /*
       * Only continue after Monetag confirms
       * the rewarded event.
       */

      status.innerText =
        "Ad completed. Processing reward...";

      await claimReward();

    } catch (error) {

      console.error(
        "MONETAG AD ERROR:",
        error
      );

      status.innerText =
        "Ad error: " +
        (
          error?.message ||
          "Unable to load ad."
        );

    }

  });



    /* ======================================
       Start Application
       ====================================== */

    console.log(
      "Starting Daily Reward App..."
    );


    document
      .getElementById("status")
      .innerText =
      "Connecting to account...";


    loginUser();


  </script>


</body>

</html>
